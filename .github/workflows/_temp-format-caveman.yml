name: Temporary Caveman formatter

on:
  push:
    branches:
      - experiment/caveman-eval-rig-v0_1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: experiment/caveman-eval-rig-v0_1

      - name: Format experiment files
        run: npx --yes prettier@3.6.2 --write .github/workflows/caveman-eval.yml experiments/caveman-eval

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.email "ci@openscience.dev"
          git config user.name "OpenScience CI"
          git add .github/workflows/caveman-eval.yml experiments/caveman-eval
          git commit -m "style: format caveman evaluation rig"
          git push origin HEAD:experiment/caveman-eval-rig-v0_1
